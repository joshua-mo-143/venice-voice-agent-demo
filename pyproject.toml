[project]
name = "venice-voice-agent-demo"
version = "0.1.0"
description = "A simple terminal voice-agent demo on the Venice API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
venice-voice-demo = "app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "audio", "venice"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
